# Quitting upstream hollywood means mashing Ctrl-C until every widget dies and
# then typing `exit` in the shell you are left with. byobu sources this file
# last, so a single key can tear the whole tmux server down instead, which ends
# PID 1 and stops the container. The hint is pinned to the left of the status
# bar so it is actually discoverable.
bind-key -n C-c kill-server
bind-key -n C-q kill-server
bind-key -n q   kill-server
bind-key -n Q   kill-server

set -g status-left '#[fg=black,bg=colour226,bold] q = QUIT #[default] #(byobu-status tmux_left)'
